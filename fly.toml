# fly.toml app configuration file generated for flowtask-cool-leaf-7076 on 2026-02-23T08:17:47+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flowtask-cool-leaf-7076'
primary_region = 'cdg'

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = "flowtask_data"
  destination = "/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
